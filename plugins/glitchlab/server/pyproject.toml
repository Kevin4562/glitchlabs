[project]
name = "glitchlab"
version = "2.0.1"
description = "GlitchLab standalone MCP server and browser UI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chipwhisperer>=6,<7",
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "mcp>=2,<3",
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "pyvisa>=1.14,<2",
  "pyvisa-py>=0.7,<1",
  "pyusb>=1.2,<2",
  "libusb-package>=1.0.26; python_version < '3.14'",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
  "zeroconf>=0.132,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
glitchlab = "glitchlab.cli:app"
glitchlab-mcp = "glitchlab.plugin_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glitchlab*"]

[tool.setuptools.package-data]
"glitchlab.viewer" = ["templates/*.html", "static/*"]
